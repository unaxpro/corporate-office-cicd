
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-network
spec:
  replicas: 2
  selector:
    matchLabels:
      app: corporate-network
  template:
    metadata:
      labels:
        app: corporate-network
    spec:
      containers:
        - name: corporate-network
          image: unaxpro/corporate-office-cicd:latest
          ports:
            - containerPort: 5000
